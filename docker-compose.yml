# Faciliter — local + VPS (un solo Compose)
#
# Imágenes compiladas (sin bind-mount de código). Iterar: npm en el host
# contra Postgres/Redis publicados, o `docker compose up --build`.
#
# NEXT_PUBLIC_* se bakean en el build de web. Defaults = local.
# En VPS, un `.env` junto a este archivo (o export) antes de `--build`.
#
# Primer boot (DB vacía): la API corre migrate deploy sola.
# Seed demo (Super / gym-de-prueba): a mano, ver docs/13-setup-db-desde-cero.md
#
# Uso:
#   docker compose up -d --build
#   docker compose exec api npm run prisma:seed

services:
  postgres:
    image: postgres:16-alpine
    container_name: faciliter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymbro
      POSTGRES_PASSWORD: gymbro
      POSTGRES_DB: gymbro
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymbro -d gymbro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: faciliter-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent-runtime-postgres:
    image: pgvector/pgvector:pg17
    container_name: faciliter-agent-runtime-postgres
    restart: unless-stopped
    env_file:
      - ./agent-runtime/.env
    environment:
      POSTGRES_USER: agent
      POSTGRES_DB: runtime
    volumes:
      - agent_runtime_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d runtime"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent-runtime-migrate:
    image: ghcr.io/lucianomocchegiani/agent-runtime:latest
    container_name: faciliter-agent-runtime-migrate
    working_dir: /app
    command: ["npm", "run", "prisma:deploy", "-w", "apps/api"]
    restart: "no"
    env_file:
      - ./agent-runtime/.env
    depends_on:
      agent-runtime-postgres:
        condition: service_healthy

  agent-runtime:
    image: ghcr.io/lucianomocchegiani/agent-runtime:latest
    container_name: faciliter-agent-runtime
    restart: unless-stopped
    env_file:
      - ./agent-runtime/.env
    environment:
      PORT: 3030
    ports:
      - "127.0.0.1:3031:3030"
    depends_on:
      agent-runtime-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3030/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: faciliter-api
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_APP_DOMAIN: ${NEXT_PUBLIC_APP_DOMAIN:-}
        NEXT_PUBLIC_WEB_PORT: ${NEXT_PUBLIC_WEB_PORT:-3002}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3002}
        NEXT_PUBLIC_AGENT_RUNTIME_URL: "https://agent-runtime.faciliter.xyz"
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_LOGIN_PROXY_URL: ${NEXT_PUBLIC_LOGIN_PROXY_URL:-https://login.faciliter.xyz}
    container_name: faciliter-web
    restart: unless-stopped
    env_file:
      - ./web/.env
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
    ports:
      - "3002:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  auth-proxy:
    build:
      context: ./auth-proxy
      dockerfile: Dockerfile
    container_name: faciliter-auth-proxy
    restart: unless-stopped
    env_file:
      - ./auth-proxy/.env
    environment:
      NODE_ENV: production
    ports:
      - "3003:3003"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3003/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: faciliter-mcp
    restart: unless-stopped
    env_file:
      - ./mcp/.env
    environment:
      NODE_ENV: production
    ports:
      - "3011:3011"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3011/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  agent_runtime_data:
