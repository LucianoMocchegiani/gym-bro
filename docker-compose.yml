# Faciliter — local + VPS (un solo Compose)
#
# Imágenes compiladas (sin bind-mount de código). Iterar: npm en el host
# contra Postgres/Redis publicados, o `docker compose up --build`.
#
# NEXT_PUBLIC_* se bakean en el build de web. Defaults = local.
# En VPS, un `.env` junto a este archivo (o export) antes de `--build`.
#
# Primer boot (DB vacía): la API corre migrate deploy sola.
# Seed demo (Super / gym-de-prueba): a mano, ver docs/13-setup-db-desde-cero.md
#
# Uso:
#   docker compose up -d --build
#   docker compose exec api npm run prisma:seed

services:
  postgres:
    image: postgres:16-alpine
    container_name: faciliter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymbro
      POSTGRES_PASSWORD: gymbro
      POSTGRES_DB: gymbro
    ports:
      # Host 5433: convive con otro Postgres (p. ej. Kuatia en 5432).
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Primer boot: crea database `chat`. Si el volumen ya existía, lo hace chat-api.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymbro -d gymbro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: faciliter-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Opcional: descomentar para UI de Postgres
  # pgadmin:
  #   image: dpage/pgadmin4:8
  #   container_name: faciliter-pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@example.com
  #     PGADMIN_DEFAULT_PASSWORD: gymbro
  #     PGADMIN_CONFIG_SERVER_MODE: "False"
  #   ports:
  #     - "127.0.0.1:5050:80"
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #     - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: faciliter-api
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_APP_DOMAIN: ${NEXT_PUBLIC_APP_DOMAIN:-}
        NEXT_PUBLIC_PLATFORM_HOST: ${NEXT_PUBLIC_PLATFORM_HOST:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3002}
        NEXT_PUBLIC_CHAT_API_URL: ${NEXT_PUBLIC_CHAT_API_URL:-http://localhost:3010}
    container_name: faciliter-web
    restart: unless-stopped
    env_file:
      - ./web/.env
    environment:
      NODE_ENV: production
    ports:
      # Host 3002: convive con otro Next (p. ej. Kuatia en 3000).
      - "3002:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  chat-api:
    build:
      context: ./chat-api
      dockerfile: Dockerfile
    container_name: faciliter-chat-api
    restart: unless-stopped
    env_file:
      - ./chat-api/.env
    environment:
      NODE_ENV: production
    ports:
      - "3010:3010"
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: faciliter-mcp
    restart: unless-stopped
    env_file:
      - ./mcp/.env
    environment:
      NODE_ENV: production
    ports:
      - "3011:3011"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3011/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  # pgadmin_data:
