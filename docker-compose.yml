services:
  postgres:
    image: postgres:16-alpine
    container_name: gymbro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymbro
      POSTGRES_PASSWORD: gymbro
      POSTGRES_DB: gymbro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymbro -d gymbro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gymbro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: gymbro-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: gymbro
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  quark-issuer:
    build:
      context: .
      dockerfile: docker/quark-issuer.Dockerfile
    container_name: gymbro-quark-issuer
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "9001"
      # Público vía cloudflared (offers OID4VCI alcanzables desde el celu).
      BASE_URL: https://issuer.pruebasaproduccunon.uno
      SERVICE_HOST: issuer.pruebasaproduccunon.uno
      LOG_LEVEL: INFO
      KMS_MODE: internal
      INTERNAL_KMS_DATABASE_URL: postgresql://quarkid:quarkid@postgres:5432/quarkid_issuer
      INTERNAL_RECORD_DATABASE_URL: postgresql://quarkid:quarkid@postgres:5432/quarkid_issuer
      # Sin RabbitMQ en Compose: publish best-effort (reconnect noise OK).
      RABBITMQ_URL: amqp://127.0.0.1:5672
      # VDR no incluido; did:web local no lo requiere para el spike.
      VDR_SERVICE_URL: http://127.0.0.1:9
      OID4VC_SUPPORTED_ALGS: ES256
    ports:
      - "9001:9001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9001/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  quark-verifier:
    build:
      context: .
      dockerfile: docker/quark-verifier.Dockerfile
    container_name: gymbro-quark-verifier
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "9002"
      BASE_URL: https://verifier.pruebasaproduccunon.uno
      SERVICE_HOST: verifier.pruebasaproduccunon.uno
      LOG_LEVEL: INFO
      KMS_MODE: internal
      INTERNAL_KMS_DATABASE_URL: postgresql://quarkid:quarkid@postgres:5432/quarkid_verifier
      INTERNAL_RECORD_DATABASE_URL: postgresql://quarkid:quarkid@postgres:5432/quarkid_verifier
      RABBITMQ_URL: amqp://127.0.0.1:5672
      VDR_SERVICE_URL: http://127.0.0.1:9
    ports:
      - "9002:9002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9002/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: gymbro-api
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      QUARK_ISSUER_BASE_URL: http://quark-issuer:9001
      QUARK_VERIFIER_BASE_URL: http://quark-verifier:9002
      QUARK_PROVISION_ENABLED: "true"
    ports:
      - "3001:3001"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      quark-issuer:
        condition: service_started
      quark-verifier:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: gymbro-web
    restart: unless-stopped
    env_file:
      - ./web/.env
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  api_node_modules:
  web_node_modules:
  web_next:
