name: identity_core_dart
description: QuarkID holder SDK para Flutter — protocolos SSI (OID4VCI, OID4VP, DIDComm) en Dart nativo.
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Almacenamiento encriptado (equivalente a Askar en paradym-wallet).
  # Fork comunitario de Isar 3: binarios a 16 KB (Google Play) y namespace AGP 8.
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2

  # Wallet key — solo este secreto vive fuera de isar (para unlock biométrico)
  flutter_secure_storage: ^9.0.0

  # Criptografía — Ed25519 y ECDSA P-256 (ES256 para EUDI)
  cryptography: ^2.7.0
  pointycastle: ^3.7.0

  # JWT — construcción y validación de tokens
  dart_jsonwebtoken: ^2.7.0

  # CBOR — necesario para mDoc (ISO 18013-5), uso en Fase 4+
  cbor: ^6.0.0

  # Modelos inmutables y serialización JSON
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # Streams reactivos — combinación de streams de isar en credential store
  rxdart: ^0.27.7

  # HTTP client — OID4VCI token/credential endpoints y did:web resolution
  dio: ^5.4.0

  # WebSocket — inbound DIDComm durante flujo activo
  web_socket_channel: ^3.0.0

  # libsodium — envelope DIDComm v1 (Anoncrypt compatible Credo)
  # 3.x: libsodium a 16 KB. Tope <3.4.6: desde ahí piden freezed_annotation 3.
  sodium: '>=3.0.0 <3.4.6'
  sodium_libs: '>=3.0.0 <3.4.6'

  # Utilidades
  uuid: ^4.3.0
  convert: ^3.1.0
  crypto: ^3.0.0
  json_ld_processor: ^1.0.4
  path: ^1.9.0
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  build_runner: ^2.4.0

flutter:
  plugin:
    platforms:
      android:
        package: com.phinx.identity_core_dart
        pluginClass: IdentityCorePlugin
      ios:
        pluginClass: IdentityCorePlugin
