name: mobile
description: Faciliter — app afiliado (Flutter)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  provider: ^6.1.5
  mobile_scanner: ^6.0.11
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  # Clon local en la raíz del monorepo (ver docs/15-kuatia-deuda-rename.md)
  identity_core_dart:
    path: ../identity-core-dart
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: assets/brand/app_icon.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0A0A0A"
  image: assets/brand/app_icon.png
  android: true
  ios: true
  android_12:
    color: "#0A0A0A"
    image: assets/brand/app_icon.png
    icon_background_color: "#0A0A0A"
